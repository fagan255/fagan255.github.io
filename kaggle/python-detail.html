                    <div class="content-header">
                        <h2>🔀 Boolean dan Kondisional</h2>
                        <p>Pelajari cara menggunakan boolean dan statement kondisional untuk kontrol logika program.</p>
                    </div>

                    <div class="content-body">
                        <h3>Apa itu Boolean?</h3>
                        <p>Boolean adalah tipe data yang hanya memiliki dua nilai: <code>True</code> (benar) dan <code>False</code> (salah). Boolean digunakan untuk logika dan kondisi.</p>

                        <div class="code-block">
x = True
y = False

print(x)         # True
print(y)         # False
print(type(x))   # &lt;class 'bool'&gt;
                        </div>

                        <h3>Operator Perbandingan</h3>
                        <p>Operator perbandingan membandingkan nilai dan mengembalikan boolean:</p>
                        
                        <div class="code-block">
# Sama dengan
print(5 == 5)   # True
print(5 == 3)   # False

# Tidak sama dengan
print(5 != 3)   # True
print(5 != 5)   # False

# Lebih dari
print(5 > 3)    # True
print(3 > 5)    # False

# Kurang dari
print(3 < 5)    # True
print(5 < 3)    # False

# Lebih dari atau sama dengan
print(5 >= 5)   # True
print(3 >= 5)   # False

# Kurang dari atau sama dengan
print(3 <= 5)   # True
print(5 <= 3)   # False
                        </div>

                        <h3>Operator Logika</h3>
                        <p>Operator logika menggabungkan kondisi boolean:</p>

                        <div class="code-block">
# AND - semua kondisi harus True
print(True and True)    # True
print(True and False)   # False
print(False and False)  # False

# OR - minimal satu kondisi harus True
print(True or False)    # True
print(False or False)   # False
print(True or True)     # True

# NOT - membalik nilai boolean
print(not True)         # False
print(not False)        # True
                        </div>

                        <div class="code-block">
# Contoh praktis
umur = 25
has_license = True

# Untuk mengemudi, harus umur >= 17 dan memiliki SIM
dapat_mengemudi = umur >= 17 and has_license
print(dapat_mengemudi)  # True

# Kondisi lebih kompleks
nilai = 80
adalah_lulus = nilai >= 60
adalah_lulus_baik = nilai >= 75

print(adalah_lulus or adalah_lulus_baik)  # True
                        </div>

                        <h3>Statement If-Else</h3>
                        <p>Gunakan <code>if</code>, <code>elif</code>, dan <code>else</code> untuk kontrol alur program:</p>

                        <div class="code-block">
# If statement
age = 20

if age >= 18:
    print("Anda sudah dewasa")

# If-else statement
if age >= 18:
    print("Anda sudah dewasa")
else:
    print("Anda masih anak-anak")

# If-elif-else statement
nilai = 85

if nilai >= 90:
    print("Grade A")
elif nilai >= 80:
    print("Grade B")
elif nilai >= 70:
    print("Grade C")
else:
    print("Grade D")
                        </div>

                        <h4>Nested If</h4>
                        <p>Anda dapat menyarangkan (nesting) statement if:</p>
                        <div class="code-block">
umur = 25
memiliki_sim = True
memiliki_mobil = True

if umur >= 18:
    if memiliki_sim:
        if memiliki_mobil:
            print("Anda dapat mengemudi")
        else:
            print("Anda perlu membeli mobil")
    else:
        print("Anda perlu mengurus SIM")
else:
    print("Anda terlalu muda untuk mengemudi")
                        </div>

                        <h3>Ternary Operator</h3>
                        <p>Cara ringkas untuk menulis if-else dalam satu baris:</p>

                        <div class="code-block">
age = 20
status = "Dewasa" if age >= 18 else "Anak-anak"
print(status)  # Dewasa

# Contoh lain
nilai = 80
grade = "Lulus" if nilai >= 60 else "Tidak Lulus"
print(grade)  # Lulus
                        </div>

                        <h3>Truthiness dan Falsiness</h3>
                        <p>Dalam Python, banyak nilai yang dianggap True atau False dalam konteks boolean:</p>

                        <div class="code-block">
# Falsy values (dianggap False)
print(bool(0))          # False
print(bool(0.0))        # False
print(bool(""))         # False (string kosong)
print(bool([]))         # False (list kosong)
print(bool({}))         # False (dictionary kosong)
print(bool(None))       # False

# Truthy values (dianggap True)
print(bool(1))          # True
print(bool(-1))         # True
print(bool("hello"))    # True (string tidak kosong)
print(bool([1, 2]))     # True (list tidak kosong)

# Contoh praktis
nama = input("Masukkan nama: ")
if nama:
    print(f"Halo, {nama}!")
else:
    print("Nama tidak boleh kosong!")
                        </div>

                        <h3>In dan Is Operator</h3>
                        <p>Operator khusus untuk pengecekan membership dan identity:</p>

                        <div class="code-block">
# In operator - cek apakah elemen ada dalam koleksi
buah = ["apel", "mangga", "jeruk"]
print("apel" in buah)       # True
print("pisang" in buah)     # False

text = "Python"
print("P" in text)          # True

# Is operator - cek apakah object adalah yang sama
x = [1, 2, 3]
y = [1, 2, 3]
z = x

print(x == y)   # True (nilai sama)
print(x is y)   # False (object berbeda)
print(x is z)   # True (object yang sama)

# Cek None
value = None
if value is None:
    print("Value adalah None")
                        </div>

                        <h3>Ringkasan</h3>
                        <p>Pada pelajaran ini, Anda telah mempelajari:</p>

                            <li>✓ Tipe data boolean (True dan False)</li>

                            <li>✓ Statement if, elif, else</li>
                            <li>✓ Nested if statements</li>
                            <li>✓ Ternary operator untuk if-else singkat</li>
                            <li>✓ Truthiness dan falsiness</li>
                            <li>✓ In dan is operator</li>
                        </ul>

      // Get lesson ID from URL
      function getLessonId() {
        const params = new URLSearchParams(window.location.search);
        return parseInt(params.get("lesson")) || 1;
      }

      // Display content
      function displayLesson(lessonId) {
        const lesson = pythonMaterials.find((m) => m.id === lessonId);
        if (lesson) {
          document.getElementById("lesson-title").textContent = lesson.titleId;
          document.getElementById("content").innerHTML = lesson.content;
          updateNavigationButtons(lessonId);
        }
      }

      // Update navigation buttons
      function updateNavigationButtons(lessonId) {
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");

        if (lessonId === 1) {
          prevBtn.disabled = true;
          prevBtn.style.opacity = "0.5";
        } else {
          prevBtn.disabled = false;
          prevBtn.style.opacity = "1";
        }

        if (lessonId === pythonMaterials.length) {
          nextBtn.disabled = true;
          nextBtn.style.opacity = "0.5";
        } else {
          nextBtn.disabled = false;
          nextBtn.style.opacity = "1";
        }
      }

      // Navigation functions
      function previousLesson() {
        let currentId = getLessonId();
        if (currentId > 1) {
          window.location.search = "?lesson=" + (currentId - 1);
        }
      }

      function nextLesson() {
        let currentId = getLessonId();
        if (currentId < pythonMaterials.length) {
          window.location.search = "?lesson=" + (currentId + 1);
        }
      }

      // Load lesson on page load
      window.onload = function () {
        displayLesson(getLessonId());
      };
    </script>
